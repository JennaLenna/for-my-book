<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single-User Book Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div>
                <h1>Book Planner</h1>
                <p class="subtitle">Single-user planner with offline cache + GitHub sync</p>
            </div>
            <button id="saveBtn" class="btn-primary">Save Now</button>
        </header>

        <section class="status-panel">
            <p><strong>Sync status:</strong> <span id="syncStatus">Initializing...</span></p>
            <p><strong>Connection:</strong> <span id="connectionStatus">Checking...</span></p>
        </section>

        <main id="plannerSections" class="planner-grid"></main>
    </div>

    <script>
        // Replace `your-worker-subdomain` with your real deployed Worker subdomain.
        window.BOOK_PLANNER_API = 'https://your-worker-subdomain.workers.dev';
    </script>
    <script src="app.js"></script>
</body>
</html>
